version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: rag-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - rag-network

  app:
    build: ./app
    container_name: rag-node
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - rag-network

  redis:
    image: redis/redis-stack:latest
    container_name: rag-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  redis-data: